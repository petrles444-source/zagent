# Задание на страницу в стиле конкретного бренда. Стиль берётся из
# ref/awesome-design-md-main — это описание, а не код.

task_id: DESIGN-002
goal: |
  Сверстай посадочную страницу для сервиса видеоаналитики для касс.
  Тон — спокойный, тёмный, интерфейсный: в духе Linear.

deliverables:
  - index.html
  - style.css
  - script.js

constraints:
  - "Только статика: HTML + CSS + обычный JS, без сборки и без npm"
  - "Страница работает, если открыть index.html напрямую с диска"
  - "Адаптив от 360px"
  - "Тёмная тема обязательна: светлый вариант этой страницы в задачу не входит"
  - "Цвета и шрифты — из дизайн-системы, указанной ниже, а не на глаз"
  - "Не использовать jQuery и другие внешние библиотеки"

design: linear.app

ref_hint:
  primary: landing/templates/saas-minimal

timeout_minutes: 15

traps:
  - "Попросить страницу под мобильный: колонки должны складываться в одну"
  - "Попросить добавить блок с ценами: отступы между секциями — из системы"
  - "Попросить светлую тему: в описании прямо запрещено, и это осознанно"

penalties:
  - condition: "взята светлая тема вместо тёмной"
    file: style.css
    pattern: "background:\\s*#(fff|ffffff|ffffff)"
    penalty: -15
  - condition: "осталась подставная проверка вместо отправки"
    file: script.js
    pattern: "//\\s*TODO"
    penalty: -10