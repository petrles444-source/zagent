<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скоро здесь что-то будет</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <h1>Скоро здесь что-то будет</h1>
  <p class="lead">
    Мы делаем сервис для команд. Пока он не готов — оставьте почту,
    и мы напишем в день запуска. Без писем «мы выбираем для вас».
  </p>

  <form id="waitlist" novalidate>
    <label for="email">Почта</label>
    <input id="email" name="email" type="email" required
           autocomplete="email" placeholder="you@company.ru"
           aria-describedby="err">
    <span id="err" class="err" role="alert"></span>
    <button type="submit" id="go">Сообщить мне</button>
    <p id="ok" class="ok" hidden role="status">Готово, мы запомнили адрес.</p>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
