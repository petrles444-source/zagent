<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruffle Advanced Player — умный шаблон</title>
  <style>
    /* ========== Базовые стили и сброс ========== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0 0 20px;
      text-align: center;
      color: #fff;
    }

    /* ========== Обёртка плеера ========== */
    .ruffle-stage {
      position: relative;
      width: 100%;
      max-width: 960px;
      /* Соотношение сторон задаётся через --ratio, по умолчанию 16:9 */
      aspect-ratio: var(--ratio, 16 / 9);
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      /* Плавное появление после загрузки */
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .ruffle-stage.is-ready {
      opacity: 1;
    }

    /* Сам плеер (Ruffle custom element) растягивается на всю обёртку */
    .ruffle-stage ruffle-player,
    .ruffle-stage .ruffle-player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ========== Панель управления ========== */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 10px 16px;
      background: #1e1e1e;
      border-radius: 12px;
      width: 100%;
      max-width: 960px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls button,
    .controls input[type="range"] {
      accent-color: #7cc4ff;
    }

    .controls button {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #e0e0e0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .controls button:hover {
      background: #3a3a3a;
      border-color: #5a5a5a;
    }

    .controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #b0b0b0;
    }

    .controls input[type="range"] {
      width: 100px;
    }

    /* ========== Fallback / статус ========== */
    .ruffle-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #1a1a1a;
      color: #ccc;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .ruffle-fallback a {
      color: #7cc4ff;
    }

    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      backdrop-filter: blur(6px);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .status-badge.is-hidden {
      opacity: 0;
    }

    /* Для браузеров без aspect-ratio (старые) — запасной вариант */
    @supports not (aspect-ratio: 1 / 1) {
      .ruffle-stage {
        height: 0;
        padding-bottom: calc(100% / (var(--ratio-num, 16) / var(--ratio-den, 9)));
      }
    }
  </style>
</head>
<body>

  <h1>Ruffle — продвинутый шаблон</h1>

  <!-- Обёртка, в которую будет помещён плеер -->
  <div class="ruffle-stage" id="stage" style="--ratio: 16 / 9; --ratio-num: 16; --ratio-den: 9;">
    <!-- Индикатор состояния загрузки -->
    <div class="status-badge" id="statusBadge">Инициализация…</div>

    <!-- Fallback, если Ruffle не загрузился или SWF не поддерживается -->
    <div class="ruffle-fallback" id="fallback" hidden>
      <p>
        Не удалось запустить Flash-анимацию.<br>
        <a id="fallbackLink" href="#" download>Скачать SWF-файл</a>
      </p>
    </div>
  </div>

  <!-- Панель управления -->
  <div class="controls" id="controls" hidden>
    <button id="btnPlayPause" title="Пауза / Возобновить">⏸ Пауза</button>
    <button id="btnRestart" title="Перезапустить">↺ Заново</button>
    <label>
      🔊
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </label>
    <button id="btnFullscreen" title="Полный экран">⛶ Экран</button>
  </div>

  <script>
    /*
     * ============================================================
     *  Ruffle Advanced Template
     *  ------------------------------------------------------------
     *  1. Глобальная конфигурация Ruffle
     *  2. Ленивая инициализация при появлении в viewport
     *  3. Программное создание плеера через JS API
     *  4. Управление воспроизведением, громкостью, полным экраном
     *  5. Обработка ошибок и fallback
     * ============================================================
     */

    // ---------- 1. КОНФИГУРАЦИЯ ----------

    // URL SWF-файла — замените на свой
    const SWF_URL = 'animation.swf';

    // Путь к Ruffle. Можно использовать CDN:
    const RUFFLE_CDN = 'https://unpkg.com/@ruffle-rs/ruffle';
    // Или self-hosted (скачайте ruffle-selfhosted и укажите путь):
    // const RUFFLE_CDN = '/path/to/ruffle/ruffle.js';

    // Глобальные настройки Ruffle (применяются ко всем плеерам на странице)
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      // --- Общие настройки страницы ---
      publicPath: undefined,          // путь к ресурсам Ruffle (если self-hosted)
      polyfills: true,                // автоматически заменять <object>/<embed>

      // --- Настройки конкретного файла ---
      autoplay: 'on',                 // 'on' | 'auto' | 'off' — автозапуск
      unmuteOverlay: 'hidden',        // 'visible' | 'hidden' — скрыть оверлей «включить звук»
      splashScreen: false,            // убрать заставку Ruffle
      backgroundColor: '#000000',     // цвет фона плеера
      letterbox: 'fullscreen',        // 'fullscreen' | 'on' | 'off' — чёрные полосы
      scale: 'showAll',               // 'showAll' | 'exactFit' | 'noBorder' | 'noScale'
      quality: 'high',                // 'low' | 'medium' | 'high' | 'best'
      wmode: 'opaque',                // 'window' | 'opaque' | 'transparent'
      allowScriptAccess: true,        // разрешить ActionScript ↔ JS
      allowNetworking: 'all',         // 'all' | 'internal' | 'none'
      allowFullscreen: true,          // разрешить полноэкранный режим
      contextMenu: 'on',              // 'on' | 'off' | 'rightClick'
      showSwfDownload: false,         // скрыть пункт «Скачать SWF» в контекстном меню
      logLevel: 'error',              // 'error' | 'warn' | 'info' | 'debug' | 'trace'
      maxExecutionDuration: 15,       // макс. время выполнения ActionScript (сек)
      upgradeToHttps: true,           // автоматически переводить HTTP → HTTPS
      compatibilityRules: true,       // включить правила совместимости
      favorFlash: false,              // отдавать приоритет поведению Flash
      warnOnUnsupportedContent: true, // предупреждать о неподдерживаемом контенте
      preloader: true,                // показывать встроенный прелоадер
      forceAlign: false,              // принудительное выравнивание
      salign: '',                     // выравнивание сцены
      fullScreenAspectRatio: 'showAll',
      frameRate: null,                // null = из SWF
      preferredRenderer: 'webgpu',    // 'webgpu' | 'canvas' | 'webgl'
      base: null,                     // базовый URL для относительных путей
      menu: true                      // показывать встроенное меню Ruffle
    };

    // ---------- 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------

    const stage = document.getElementById('stage');
    const statusBadge = document.getElementById('statusBadge');
    const fallback = document.getElementById('fallback');
    const fallbackLink = document.getElementById('fallbackLink');
    const controls = document.getElementById('controls');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnRestart = document.getElementById('btnRestart');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const volumeSlider = document.getElementById('volumeSlider');

    /** Показать статус в бейдже */
    function setStatus(text, autoHide = false) {
      statusBadge.textContent = text;
      statusBadge.classList.remove('is-hidden');
      if (autoHide) {
        setTimeout(() => statusBadge.classList.add('is-hidden'), 2000);
      }
    }

    /** Показать fallback */
    function showFallback(message) {
      fallback.hidden = false;
      fallback.querySelector('p').innerHTML = message;
      fallbackLink.href = SWF_URL;
      fallbackLink.download = SWF_URL.split('/').pop() || 'movie.swf';
      statusBadge.classList.add('is-hidden');
    }

    /** Загрузить скрипт Ruffle динамически */
    function loadRuffleScript() {
      return new Promise((resolve, reject) => {
        if (window.RufflePlayer && window.RufflePlayer.newest) {
          resolve(); // уже загружен
          return;
        }
        const script = document.createElement('script');
        script.src = RUFFLE_CDN;
        script.async = true;
        script.onload = () => {
          // Даём Ruffle время инициализироваться
          const check = setInterval(() => {
            if (window.RufflePlayer && window.RufflePlayer.newest) {
              clearInterval(check);
              resolve();
            }
          }, 50);
          // Таймаут на инициализацию
          setTimeout(() => {
            clearInterval(check);
            if (!window.RufflePlayer || !window.RufflePlayer.newest) {
              reject(new Error('Ruffle не инициализировался'));
            }
          }, 5000);
        };
        script.onerror = () => reject(new Error('Не удалось загрузить Ruffle'));
        document.head.appendChild(script);
      });
    }

    // ---------- 3. ИНИЦИАЛИЗАЦИЯ ПЛЕЕРА ----------

    let player = null; // ссылка на экземпляр PlayerV1

    async function initPlayer() {
      try {
        setStatus('Загрузка Ruffle…');
        await loadRuffleScript();

        setStatus('Создание плеера…');
        const ruffle = window.RufflePlayer.newest();
        player = ruffle.createPlayer();

        // Настройки для конкретного экземпляра (переопределяют глобальные)
        player.config = {
          // Можно переопределить любые опции из BaseLoadOptions
          autoplay: 'on',
          unmuteOverlay: 'hidden',
          splashScreen: false,
          backgroundColor: '#000000',
          scale: 'showAll',
          quality: 'high',
          wmode: 'opaque',
          allowScriptAccess: true,
          allowFullscreen: true,
          letterbox: 'fullscreen',
          logLevel: 'error',
          showSwfDownload: false,
          contextMenu: 'on'
        };

        // Добавляем плеер в DOM (внутри обёртки, поверх фона)
        stage.appendChild(player);
        // Скрываем fallback, если он был виден
        fallback.hidden = true;

        // Загружаем SWF
        setStatus('Загрузка анимации…');
        await player.load(SWF_URL);

        // Если загрузилось — показываем панель управления и делаем stage видимым
        setStatus('Готово', true);
        stage.classList.add('is-ready');
        controls.hidden = false;

        // Начальная синхронизация громкости
        volumeSlider.value = player.volume;

        // Подписываемся на события плеера (если поддерживаются)
        // Ruffle не предоставляет стандартных DOM-событий вроде 'play',
        // но мы можем отслеживать readyState и metadata.
        // Для простоты используем опрос readyState.
        // При желании можно добавить периодическую проверку.

        console.log('[Ruffle] Плеер успешно инициализирован');
      } catch (err) {
        console.error('[Ruffle] Ошибка:', err);
        showFallback(
          `Ошибка загрузки: ${err.message}.<br><br>` +
          `Убедитесь, что файл <code>${SWF_URL}</code> доступен.`
        );
      }
    }

    // ---------- 4. ЛЕНИВАЯ ИНИЦИАЛИЗАЦИЯ (IntersectionObserver) ----------

    // Запускаем создание плеера только когда контейнер появился в viewport.
    // Это экономит ресурсы, если на странице несколько плееров.
    let initialized = false;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !initialized) {
          initialized = true;
          observer.disconnect();
          initPlayer();
        }
      });
    }, {
      rootMargin: '200px', // начинаем загрузку за 200px до появления
      threshold: 0.01
    });

    observer.observe(stage);

    // ---------- 5. УПРАВЛЕНИЕ ВОСПРОИЗВЕДЕНИЕМ ----------

    btnPlayPause.addEventListener('click', () => {
      if (!player) return;
      if (player.suspended) {
        player.resume();
        btnPlayPause.textContent = '⏸ Пауза';
      } else {
        player.suspend();
        btnPlayPause.textContent = '▶ Воспроизвести';
      }
    });

    btnRestart.addEventListener('click', async () => {
      if (!player) return;
      try {
        await player.reload();
        setStatus('Перезапуск…', true);
        // После reload плеер сохраняет настройки, но нужно сбросить кнопку
        btnPlayPause.textContent = '⏸ Пауза';
      } catch (e) {
        console.error('[Ruffle] Ошибка перезапуска:', e);
      }
    });

    volumeSlider.addEventListener('input', () => {
      if (player) {
        player.volume = parseFloat(volumeSlider.value);
      }
    });

    btnFullscreen.addEventListener('click', () => {
      if (!player) return;
      if (player.isFullscreen) {
        player.exitFullscreen();
      } else {
        player.requestFullscreen();
      }
    });

    // ---------- 6. ДОПОЛНИТЕЛЬНО: ГЛОБАЛЬНЫЙ ОБРАБОТЧИК ОШИБОК ----------

    window.addEventListener('error', (event) => {
      // Если ошибка связана с Ruffle, показываем fallback
      if (event.message && event.message.includes('ruffle')) {
        console.error('[Ruffle] Глобальная ошибка:', event.message);
      }
    });

    // ---------- 7. ЭКСПОРТ ДЛЯ ОТЛАДКИ ----------
    // В консоли можно писать: window.__rufflePlayer для доступа к плееру
    Object.defineProperty(window, '__rufflePlayer', {
      get() { return player; }
    });

  </script>
</body>
</html>
