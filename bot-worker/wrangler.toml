# Конфигурация воркера для Ады.
#
# Зачем отдельный файл
# --------------------
# Wrangler без конфига не знает двух вещей: какой файл запускать и на
# какой дате считать доступными Workers API. Дата обязательна: без неё
# развёртывание падает с ошибкой про отсутствие `compatibility_date`,
# и это самая первая ошибка у новичков.
#
# Секретов здесь нет и быть не должно: `TELEGRAM_BOT_TOKEN`,
# `MODEL_API_KEY` и `WEBHOOK_SECRET` задаются командой
# `wrangler secret put`, а не записью в файл. Токен в конфиге попал бы
# в репозиторий вместе с ним — ровно та ошибка, от которой
# предупреждают все инструкции по Telegram-ботам.

name = "zagent-ada"
main = "worker.js"
compatibility_date = "2026-10-08"

# Логи видны в панели Cloudflare → Workers → Logs. Без этого флага
# запись об ошибке уходит в никуда, и сбой видно только по тому, что
# бот перестал отвечать.
[observability]
enabled = true
