<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_PORTAL // Ruffle_Engine</title>
    <!-- Подключаем Tailwind CSS для стилизации -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Настройка Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            yellow: '#FCE300',
                            blue: '#00F0FF',
                            pink: '#FF003C',
                            dark: '#050505',
                            gray: '#111111',
                            panel: 'rgba(10, 10, 10, 0.85)'
                        }
                    },
                    fontFamily: {
                        'orbitron': ['Orbitron', 'sans-serif'],
                        'mono': ['Share Tech Mono', 'monospace'],
                    },
                    animation: {
                        'glitch': 'glitch 1s linear infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- Стили -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #fff;
        }

        /* Эффект старого монитора (Scanlines) */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
        }

        /* Канвас для фоновой анимации */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: contrast(1.2) brightness(0.9);
        }

        #ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cyber-panel {
            background: theme('colors.cyber.panel');
            border: 2px solid theme('colors.cyber.blue');
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
            position: relative;
            pointer-events: auto;
            clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
            transition: all 0.3s ease;
        }

        /* Желтая декоративная линия слева */
        .cyber-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background-color: theme('colors.cyber.yellow');
            box-shadow: 0 0 10px theme('colors.cyber.yellow');
        }

        .drop-zone {
            background: rgba(0, 240, 255, 0.05);
            border: 2px dashed theme('colors.cyber.pink');
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.2s ease;
        }
        
        .drop-zone.dragover, .drop-zone:hover {
            background: rgba(255, 0, 60, 0.15);
            border-style: solid;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.4) inset;
        }

        /* Кнопка */
        .cyber-btn {
            background: theme('colors.cyber.yellow');
            color: #000;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: none;
            position: relative;
            text-transform: uppercase;
            font-weight: bold;
        }
        .cyber-btn:hover {
            background: theme('colors.cyber.blue');
            box-shadow: 0 0 15px theme('colors.cyber.blue');
        }

        #ruffle-container {
            width: 100%;
            height: 100%;
            min-height: 400px;
            display: none;
            background: #000;
            border: 1px solid theme('colors.cyber.blue');
            position: relative;
        }

        .glitch-text {
            text-shadow: 2px 2px theme('colors.cyber.pink'), -2px -2px theme('colors.cyber.blue');
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; border-left: 1px solid #333; }
        ::-webkit-scrollbar-thumb { background: theme('colors.cyber.yellow'); }
    </style>
</head>
<body>

    <!-- Фоновая анимация Canvas -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Эффект старого монитора -->
    <div class="scanlines"></div>

    <!-- Пользовательский интерфейс -->
    <div id="ui-layer" class="p-4 sm:p-8 font-mono">
        <div id="main-card" class="cyber-panel w-full max-w-4xl flex flex-col items-center p-8">
            
            <!-- Заголовок -->
            <div class="text-center mb-8 flex-shrink-0 w-full relative">
                <div class="absolute top-0 right-0 text-cyber-blue text-xs opacity-50 tracking-widest">
                    SYS.VER.4.0.9 // RUFFLE_CORE
                </div>
                <div class="inline-flex items-center justify-center p-3 bg-cyber-pink/20 text-cyber-pink border border-cyber-pink mb-4 animate-pulse-fast">
                    <i class="fa-solid fa-microchip text-3xl"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-white font-orbitron glitch-text uppercase tracking-wider mb-2">
                    Cyber_Portal
                </h1>
                <p class="text-cyber-yellow text-sm tracking-widest uppercase mt-2 bg-black inline-block px-2 border border-cyber-yellow">
                    > Initialize SWF execution module_
                </p>
            </div>

            <!-- Зона загрузки файла (Drag & Drop) -->
            <div id="drop-zone" class="drop-zone w-full flex flex-col items-center justify-center p-12 cursor-pointer relative group mt-4">
                <i class="fa-solid fa-file-arrow-up text-5xl text-cyber-pink mb-4 group-hover:text-white transition-colors duration-300"></i>
                <h3 class="text-xl font-bold text-white mb-2 font-orbitron tracking-widest uppercase">Target Lock: SWF File</h3>
                <p class="text-cyber-blue/70 text-sm mb-6 text-center max-w-md">
                    DATA REMAINS LOCAL. NO SERVER UPLOAD DETECTED. EMULATION PROCEEDING IN BROWSER ENVIRONMENT.
                </p>
                
                <label for="file-upload" class="cyber-btn z-10 px-8 py-3 transition-all duration-300 cursor-pointer font-orbitron tracking-widest">
                    [ BROWSE_DATA ]
                </label>
                <input id="file-upload" type="file" accept=".swf" class="hidden" />
                
                <!-- Декоративные уголки -->
                <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-cyber-blue"></div>
                <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-cyber-blue"></div>
            </div>

            <!-- Уведомление об ошибке -->
            <div id="error-message" class="hidden mt-4 w-full bg-red-900/50 border border-cyber-pink text-white px-4 py-3 flex items-center font-orbitron text-sm">
                <i class="fa-solid fa-triangle-exclamation text-cyber-yellow mr-3"></i>
                <span id="error-text">ERROR: INVALID_FORMAT_DETECTED. REQUIRES .SWF</span>
            </div>

            <!-- Контейнер плеера Ruffle -->
            <div id="ruffle-container" class="mt-4">
                <button id="close-player" class="absolute -top-4 -right-4 z-50 bg-cyber-pink hover:bg-white text-black w-10 h-10 flex items-center justify-center transition-colors border-2 border-black font-bold">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>

            <!-- Нижняя декоративная полоса -->
            <div class="w-full h-1 bg-cyber-blue/30 mt-8 relative">
                <div class="absolute top-0 left-1/4 w-1/4 h-full bg-cyber-blue animate-pulse-fast"></div>
            </div>
        </div>
    </div>

    <!-- Подключаем эмулятор Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <!-- Логика приложения и Анимация -->
    <script>
        // === 1. КИБЕРПАНК АНИМАЦИЯ (CANVAS) ===
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let nodes = [];
        const nodeCount = 80;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: null, y: null, radius: 150 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        // Узлы цифровой сети
        class CyberNode {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                // Движение строго по сетке (горизонтально или вертикально)
                this.axis = Math.random() > 0.5 ? 'x' : 'y';
                this.speed = (Math.random() * 2 + 0.5) * (Math.random() > 0.5 ? 1 : -1);
                
                const colors = ['#00F0FF', '#FF003C', '#FCE300', '#111111'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Таймер смены направления
                this.turnTimer = Math.random() * 100 + 50;
            }

            draw() {
                ctx.fillStyle = this.color;
                // Рисуем квадрат вместо круга
                ctx.fillRect(this.x, this.y, this.size * 2, this.size * 2);
            }

            update() {
                // Движение
                if (this.axis === 'x') this.x += this.speed;
                else this.y += this.speed;

                // Смена направления под 90 градусов (эффект микросхемы)
                this.turnTimer--;
                if (this.turnTimer <= 0) {
                    this.axis = this.axis === 'x' ? 'y' : 'x';
                    this.speed = (Math.random() * 2 + 0.5) * (Math.random() > 0.5 ? 1 : -1);
                    this.turnTimer = Math.random() * 100 + 50;
                }

                // Зацикливание экрана
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Искажение от мыши (Glitch эффект)
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        // Резкие скачки вместо плавного отталкивания
                        this.x += (Math.random() - 0.5) * 10;
                        this.y += (Math.random() - 0.5) * 10;
                    }
                }
            }
        }

        function initNodes() {
            nodes = [];
            for (let i = 0; i < nodeCount; i++) {
                nodes.push(new CyberNode());
            }
        }

        function animateCyberGrid() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // Оставляем след
            ctx.fillRect(0, 0, width, height);

            // Рисуем фоновую сетку (опционально)
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            ctx.beginPath();
            for(let x = 0; x < width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y = 0; y < height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();

            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();

                // Соединительные линии (только если они на одной оси)
                for (let j = i; j < nodes.length; j++) {
                    let dx = Math.abs(nodes[i].x - nodes[j].x);
                    let dy = Math.abs(nodes[i].y - nodes[j].y);
                    
                    // Соединяем только если почти на одной линии X или Y
                    if ((dx < 2 || dy < 2) && (dx + dy < 200)) {
                        ctx.beginPath();
                        ctx.strokeStyle = nodes[i].color;
                        ctx.globalAlpha = 1 - ((dx + dy) / 200);
                        ctx.lineWidth = 1;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
            requestAnimationFrame(animateCyberGrid);
        }

        initNodes();
        animateCyberGrid();

        // === 2. ЛОГИКА RUFFLE И DRAG & DROP ===
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');
        const ruffleContainer = document.getElementById('ruffle-container');
        const closeBtn = document.getElementById('close-player');
        const errorMsg = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const mainCard = document.getElementById('main-card');
        
        let currentPlayer = null;

        // Настройка Ruffle
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "visible",
            backgroundColor: "#000000",
            letterbox: "on", // сохранять пропорции
        };

        // Обработка Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Обработка клика по зоне для инпута
        dropZone.addEventListener('click', (e) => {
            if(e.target !== fileInput && e.target.tagName !== 'LABEL') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Функция обработки файла
        function handleFile(file) {
            hideError();
            
            // Проверка расширения
            if (!file.name.toLowerCase().endsWith('.swf')) {
                showError('Пожалуйста, загрузите файл формата .swf');
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                playSwf(arrayBuffer);
            };

            reader.onerror = function() {
                showError('Не удалось прочитать файл.');
            };

            reader.readAsArrayBuffer(file);
        }

        // Запуск Ruffle плеера
        function playSwf(dataBuffer) {
            try {
                const ruffle = window.RufflePlayer.newest();
                currentPlayer = ruffle.createPlayer();
                
                // Настраиваем стили плеера
                currentPlayer.style.width = '100%';
                currentPlayer.style.height = '100%';
                
                // Очищаем контейнер от старого плеера, но сохраняем кнопку закрытия
                const children = Array.from(ruffleContainer.childNodes);
                children.forEach(child => {
                    if (child.id !== 'close-player') {
                        ruffleContainer.removeChild(child);
                    }
                });

                ruffleContainer.appendChild(currentPlayer);

                // Загружаем бинарные данные
                currentPlayer.load({ data: dataBuffer });

                // Изменяем интерфейс
                dropZone.style.display = 'none';
                ruffleContainer.style.display = 'block';
                
                // Делаем карточку больше для плеера
                mainCard.classList.remove('max-w-4xl');
                mainCard.classList.add('max-w-6xl');
                mainCard.style.height = '85vh';

            } catch (err) {
                console.error(err);
                showError('Ошибка при инициализации эмулятора Ruffle.');
            }
        }

        // Закрытие плеера и возврат к зоне загрузки
        closeBtn.addEventListener('click', () => {
            if (currentPlayer) {
                // Уничтожаем текущий плеер
                currentPlayer.remove();
                currentPlayer = null;
            }
            
            ruffleContainer.style.display = 'none';
            dropZone.style.display = 'flex';
            
            // Возвращаем размер карточки
            mainCard.classList.remove('max-w-6xl');
            mainCard.classList.add('max-w-4xl');
            mainCard.style.height = 'auto';
            
            // Очищаем input
            fileInput.value = '';
        });

        // Утилиты для ошибок
        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.remove('hidden');
            setTimeout(hideError, 5000);
        }

        function hideError() {
            errorMsg.classList.add('hidden');
        }
    </script>
</body>
</html>
