<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flash Museum</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4ede4;
      color: #2c2c2c;
      font-family: 'Inter', sans-serif;
      padding: 60px 40px;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 60px;
      border-bottom: 2px solid #c0392b;
      padding-bottom: 24px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      color: #c0392b;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 1rem;
      color: #7a6a55;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px;
    }
    .exhibit {
      background: #fff;
      padding: 20px;
      border: 1px solid #d4c5b0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .exhibit:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.1);
    }
    .exhibit .frame {
      aspect-ratio: 4 / 3;
      background: #1a1a1a;
      border: 8px solid #f4ede4;
      outline: 1px solid #d4c5b0;
      position: relative;
      overflow: hidden;
    }
    .exhibit ruffle-player,
    .exhibit embed {
      width: 100%;
      height: 100%;
    }
    .exhibit h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-top: 16px;
      color: #2c2c2c;
    }
    .exhibit .meta {
      font-size: 0.8rem;
      color: #9a8a75;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .exhibit .desc {
      font-size: 0.9rem;
      color: #5a4a35;
      margin-top: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Flash Museum</h1>
    <div class="subtitle">Коллекция цифрового наследия</div>
  </header>
  <div class="gallery">
    <article class="exhibit">
      <div class="frame">
        <embed src="game1.swf" type="application/x-shockwave-flash" width="100%" height="100%">
      </div>
      <h3>Alien Hominid</h3>
      <div class="meta">2002 · Action</div>
      <p class="desc">Культовая аркада о пришельце, сбежавшем от агентов ФБР.</p>
    </article>
    <article class="exhibit">
      <div class="frame">
        <embed src="game2.swf" type="application/x-shockwave-flash" width="100%" height="100%">
      </div>
      <h3>Dino Run</h3>
      <div class="meta">2008 · Platformer</div>
      <p class="desc">Побег от вымирания в пиксельном мире динозавров.</p>
    </article>
    <article class="exhibit">
      <div class="frame">
        <embed src="anim1.swf" type="application/x-shockwave-flash" width="100%" height="100%">
      </div>
      <h3>Badger Badger</h3>
      <div class="meta">2003 · Animation</div>
      <p class="desc">Бесконечный цикл барсуков, змей и грибов.</p>
    </article>
  </div>
</body>
</html>
