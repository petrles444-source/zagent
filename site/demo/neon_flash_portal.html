<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostalgia Engine | Ruffle</title>
    <!-- Подключаем Tailwind CSS для стилизации -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Настройка Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#9f7aea',
                            500: '#805ad5',
                            600: '#6b46c1',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- Стили -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f0c29;
        }

        /* Канвас для фоновой анимации */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Основной контейнер интерфейса поверх канваса */
        #ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Пропускаем клики сквозь контейнер, если клик не по карточке */
        }

        .glass-panel {
            background: rgba(20, 20, 35, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(138, 43, 226, 0.2);
            pointer-events: auto; /* Включаем клики для карточки */
            transition: all 0.5s ease;
        }

        /* Стили для зоны Drag & Drop */
        .drop-zone {
            border: 2px dashed rgba(159, 122, 234, 0.5);
            transition: all 0.3s ease;
        }
        .drop-zone.dragover {
            background: rgba(159, 122, 234, 0.1);
            border-color: #9f7aea;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(159, 122, 234, 0.4);
        }

        /* Контейнер для Ruffle плеера */
        #ruffle-container {
            width: 100%;
            height: 100%;
            min-height: 400px;
            display: none;
            border-radius: 0.5rem;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8) inset;
        }

        /* Кастомный скроллбар если понадобится */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(159, 122, 234, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Фоновая анимация Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Пользовательский интерфейс -->
    <div id="ui-layer" class="p-4 sm:p-8">
        <div id="main-card" class="glass-panel rounded-3xl w-full max-w-4xl flex flex-col items-center p-8">
            
            <!-- Заголовок -->
            <div class="text-center mb-8 flex-shrink-0">
                <div class="inline-flex items-center justify-center p-3 bg-brand-500/20 rounded-full mb-4 animate-pulse-slow">
                    <i class="fa-solid fa-bolt text-brand-400 text-3xl"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
                    Flash Portal
                </h1>
                <p class="text-gray-300 font-light tracking-wide">
                    Оживите свои SWF файлы с помощью магии Ruffle
                </p>
            </div>

            <!-- Зона загрузки файла (Drag & Drop) -->
            <div id="drop-zone" class="drop-zone rounded-2xl w-full flex flex-col items-center justify-center p-12 cursor-pointer relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-brand-600/10 to-pink-600/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                
                <i class="fa-solid fa-cloud-arrow-up text-6xl text-brand-400 mb-4 group-hover:-translate-y-2 transition-transform duration-300"></i>
                <h3 class="text-2xl font-semibold text-white mb-2">Перетащите SWF файл сюда</h3>
                <p class="text-gray-400 text-sm mb-6 text-center max-w-md">
                    Ваш файл не загружается на сервер. Он будет проигран локально в вашем браузере через эмулятор Ruffle.
                </p>
                
                <label for="file-upload" class="relative z-10 px-8 py-3 bg-brand-500 hover:bg-brand-400 text-white font-semibold rounded-full shadow-lg hover:shadow-brand-500/50 transition-all duration-300 cursor-pointer">
                    Выбрать файл
                </label>
                <input id="file-upload" type="file" accept=".swf" class="hidden" />
            </div>

            <!-- Уведомление об ошибке -->
            <div id="error-message" class="hidden mt-4 w-full bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-3"></i>
                <span id="error-text">Произошла ошибка. Убедитесь, что это файл формата .swf</span>
            </div>

            <!-- Контейнер плеера Ruffle -->
            <div id="ruffle-container" class="relative">
                <!-- Кнопка закрытия плеера (чтобы загрузить другой файл) -->
                <button id="close-player" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-red-500/80 text-white w-10 h-10 rounded-full flex items-center justify-center transition-colors backdrop-blur-md">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Подключаем эмулятор Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <!-- Логика приложения и Анимация -->
    <script>
        // === 1. КРАСИВАЯ ФОНОВАЯ АНИМАЦИЯ (CANVAS) ===
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 120; // Количество частиц
        const connectionDistance = 150; // Дистанция соединения линий

        let mouse = { x: null, y: null, radius: 200 };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });
        
        // Поддержка Touch для телефонов
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                // Неоновые цвета
                const colors = ['#9f7aea', '#ed64a6', '#4fd1c5', '#667eea'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Движение
                this.x += this.speedX;
                this.y += this.speedY;

                // Отскок от краев
                if (this.x < 0 || this.x > width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > height) this.speedY = -this.speedY;

                // Взаимодействие с мышью
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < maxDistance) {
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            // Заливка градиентом
            let gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#0f0c29');
            gradient.addColorStop(0.5, '#302b63');
            gradient.addColorStop(1, '#24243e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                ctx.fillStyle = particles[i].color;
                particles[i].draw();

                // Соединительные линии
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.strokeStyle = particles[i].color;
                        ctx.globalAlpha = 1 - (distance / connectionDistance); // Прозрачность зависит от расстояния
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1; // Сброс
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // === 2. ЛОГИКА RUFFLE И DRAG & DROP ===
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');
        const ruffleContainer = document.getElementById('ruffle-container');
        const closeBtn = document.getElementById('close-player');
        const errorMsg = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const mainCard = document.getElementById('main-card');
        
        let currentPlayer = null;

        // Настройка Ruffle
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "visible",
            backgroundColor: "#000000",
            letterbox: "on", // сохранять пропорции
        };

        // Обработка Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Обработка клика по зоне для инпута
        dropZone.addEventListener('click', (e) => {
            if(e.target !== fileInput && e.target.tagName !== 'LABEL') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Функция обработки файла
        function handleFile(file) {
            hideError();
            
            // Проверка расширения
            if (!file.name.toLowerCase().endsWith('.swf')) {
                showError('Пожалуйста, загрузите файл формата .swf');
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                playSwf(arrayBuffer);
            };

            reader.onerror = function() {
                showError('Не удалось прочитать файл.');
            };

            reader.readAsArrayBuffer(file);
        }

        // Запуск Ruffle плеера
        function playSwf(dataBuffer) {
            try {
                const ruffle = window.RufflePlayer.newest();
                currentPlayer = ruffle.createPlayer();
                
                // Настраиваем стили плеера
                currentPlayer.style.width = '100%';
                currentPlayer.style.height = '100%';
                
                // Очищаем контейнер от старого плеера, но сохраняем кнопку закрытия
                const children = Array.from(ruffleContainer.childNodes);
                children.forEach(child => {
                    if (child.id !== 'close-player') {
                        ruffleContainer.removeChild(child);
                    }
                });

                ruffleContainer.appendChild(currentPlayer);

                // Загружаем бинарные данные
                currentPlayer.load({ data: dataBuffer });

                // Изменяем интерфейс
                dropZone.style.display = 'none';
                ruffleContainer.style.display = 'block';
                
                // Делаем карточку больше для плеера
                mainCard.classList.remove('max-w-4xl');
                mainCard.classList.add('max-w-6xl');
                mainCard.style.height = '85vh';

            } catch (err) {
                console.error(err);
                showError('Ошибка при инициализации эмулятора Ruffle.');
            }
        }

        // Закрытие плеера и возврат к зоне загрузки
        closeBtn.addEventListener('click', () => {
            if (currentPlayer) {
                // Уничтожаем текущий плеер
                currentPlayer.remove();
                currentPlayer = null;
            }
            
            ruffleContainer.style.display = 'none';
            dropZone.style.display = 'flex';
            
            // Возвращаем размер карточки
            mainCard.classList.remove('max-w-6xl');
            mainCard.classList.add('max-w-4xl');
            mainCard.style.height = 'auto';
            
            // Очищаем input
            fileInput.value = '';
        });

        // Утилиты для ошибок
        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.remove('hidden');
            setTimeout(hideError, 5000);
        }

        function hideError() {
            errorMsg.classList.add('hidden');
        }
    </script>
</body>
</html>
